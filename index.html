</style></head><body><header><div><span class="brand"><span class="mark" aria-hidden="true">✳</span>씨앗노트</span><button class="primary" id="add">＋ 아이디어 추가</button></div></header><main><section class="hero"><h1>내 아이디어 노트</h1></section><nav class="tabs" aria-label="노트 보기"><button id="all">전체 메모</button><button id="rec">추천 보기</button></nav><div id="notice" class="notice" role="status"></div><section id="list"></section><small>메모는 이 브라우저에 저장돼요. 사이트 데이터를 지우면 메모도 지워져요.</small><button hidden id="direct" class="primary">새 씨앗노트로 전부 옮기기</button><p id="directStatus" role="status"></p><details id="transfer"><summary>메모 한 번에 옮기기</summary>

<input id="backupFile" type="file" accept=".json,application/json" hidden><p id="transferStatus" role="status"></p></details>
</main>
<dialog id="editor" aria-labelledby="editTitle"><form id="form"><div class="top"><h2 id="editTitle">아이디어 추가</h2><button type="button" aria-label="닫기" data-close>×</button></div><label>제목<input id="titleField" required placeholder="예: 냉장고 메모"></label><label>한 줄 설명<input id="desc" required placeholder="누구에게 어떤 도움이 되나요?"></label><label>첫 기능<textarea id="feature" required rows="3" placeholder="처음 만들 기능 하나를 적어 주세요"></textarea></label><p id="editError" role="alert"></p><div class="actions"><button class="primary">저장하기</button><button type="button" data-close>취소</button></div></form></dialog>

<script>
'use strict';
const $=id=>document.getElementById(id);
const key='seednote-v1';
let state={notes:[],chosen:null}, recommended=false, editing=null, candidate=null, type='', previous=null, storageOK=true;
try{const saved=localStorage.getItem(key);if(saved){state=JSON.parse(saved);if(!Array.isArray(state.notes)||!state.notes.every(n=>n&&['id','title','desc','feature'].every(k=>typeof n[k]==='string')))throw Error()}}
catch{state={notes:[],chosen:null};storageOK=false;$('notice').textContent='저장 공간을 읽지 못했어요. 브라우저의 저장 설정을 확인해 주세요.'}
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls;e.textContent=txt;return e}
function button(txt,fn,cls=''){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}
function save(next,message,undo=false){
 try{if(!storageOK)throw Error();localStorage.setItem(key,JSON.stringify(next))}
 catch{$('notice').textContent=$('editError').textContent='저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.';return false}
 previous=undo?null:state;state=next;render();$('notice').textContent=message;
 if(previous)$('notice').append(button('되돌리기',()=>save(previous,'직전 변경을 되돌렸어요.',true)));return true
}
function assess(n){
 const s=n.feature;
 if(/실시간|동기화|친구.*공유|초대|함께 수정|공동 편집|결제|서버|로그인/.test(s))return [1,'여러 기기 연결이나 외부 서비스가 필요할 수 있어 준비할 일이 더 있어요.'];
 if(/AI|인공지능|분석|자동 추천/i.test(s))return [0,'판단할 정보가 부족해요. 어떤 입력으로 어떤 결과를 낼지 구체화해 보세요.'];
 const m=s.match(/기록|저장|입력|추가|체크|계산|목록|타이머|카운트/);
 return m?[2,'첫 기능에 ‘'+m[0]+'’이 있어요. 이 동작부터 한 기기에서 작게 시험해 볼 수 있어요.']:[0,'판단할 정보가 부족해요. 사용자가 할 첫 동작을 적어 보세요.']
}
function render(){
 $('all').textContent='전체 메모 '+state.notes.length;
 $('all').setAttribute('aria-pressed',!recommended);$('rec').setAttribute('aria-pressed',recommended);
 const list=$('list');list.replaceChildren();
 if(!state.notes.length){const box=el('div','empty','');box.append(el('h3','','아직 아이디어가 없어요'),el('p','','위의 ‘아이디어 추가’로 첫 메모를 남겨 보세요.'));list.append(box);return}
 const notes=recommended?[...state.notes].sort((a,b)=>assess(b)[0]-assess(a)[0]).slice(0,3):state.notes;
 if(recommended)list.append(el('p','muted','첫 기능을 작게 시험하기 쉬운 순서예요. 단서가 같으면 최근에 추가한 메모가 먼저 나와요.'));
 for(const n of notes){const c=el('article','card','');if(state.chosen===n.id)c.append(el('div','chosen','✓ 먼저 만들 아이디어'));
 c.append(el('h3','',n.title),el('p','',n.desc));const f=el('div','feature','');f.append(el('span','label','첫 기능'),el('p','',n.feature));c.append(f);
 if(recommended)c.append(el('p','reason',assess(n)[1]));
 const a=el('div','actions','');if(recommended)a.append(button('만들기 프롬프트 받기',()=>openBuilder(n),'primary'));
 const pick=button(state.chosen===n.id?'선택됨':'먼저 만들기',()=>save({...state,chosen:n.id},'먼저 만들 아이디어를 선택했어요.'));pick.disabled=state.chosen===n.id;
 a.append(pick,button('수정',()=>edit(n)));c.append(a);list.append(c)}
}
function edit(n){editing=n?.id??null;$('editTitle').textContent=n?'아이디어 수정':'아이디어 추가';$('titleField').value=n?.title??'';$('desc').value=n?.desc??'';$('feature').value=n?.feature??'';$('editError').textContent='';$('editor').showModal();$('titleField').focus()}
$('add').onclick=()=>edit(null);
$('form').onsubmit=e=>{e.preventDefault();const fields=['titleField','desc','feature'];for(const id of fields){if(!$(id).value.trim()){$('editError').textContent='빈칸에 내용을 입력해 주세요.';$(id).focus();return}}
const n={id:editing??Date.now().toString(36)+Math.random().toString(36).slice(2),title:$('titleField').value.trim(),desc:$('desc').value.trim(),feature:$('feature').value.trim()};
const notes=editing?state.notes.map(old=>old.id===editing?n:old):[n,...state.notes];if(save({...state,notes},'메모를 저장했어요.'))$('editor').close()};
$('all').onclick=()=>{recommended=false;render()};$('rec').onclick=()=>{recommended=true;render()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
const formats={'앱':{hint:'휴대폰에 설치해서 써요.',os:['안드로이드','아이폰'],task:'터치로 조작하는 모바일 앱',test:'선택한 휴대폰 환경에서 실행하고 터치 입력과 화면 이동을 확인해줘.'},'웹':{hint:'브라우저에서 주소를 열어 써요.',task:'작은 화면에서도 읽기 쉬운 반응형 웹',test:'휴대폰 너비에서 첫 기능을 실행하고 가로 스크롤 없이 조작되는지 확인해줘.'},'컴퓨터 프로그램':{hint:'컴퓨터에 설치해서 써요.',os:['윈도우','맥'],task:'창에서 실행하는 데스크톱 프로그램',test:'선택한 운영체제에서 실행하는 방법을 제시하고 키보드와 마우스로 첫 기능을 확인해줘.'}};
function openBuilder(n){candidate=n;type='';$('subject').textContent=n.title;$('types').replaceChildren();$('settings').replaceChildren();$('hint').textContent='어떤 형태로 만들까요?';$('result').hidden=true;document.querySelector('.builder-footer').hidden=true;for(const t of Object.keys(formats)){const b=button(t,()=>choose(t));b.setAttribute('aria-pressed','false');$('types').append(b)}$('builder').showModal()}
function choose(t){type=t;const f=formats[t];for(const b of $('types').children)b.setAttribute('aria-pressed',b.textContent===t);$('hint').textContent=f.hint;$('settings').replaceChildren();if(f.os){const label=el('label','','사용할 기기');const select=document.createElement('select');select.id='os';for(const os of f.os)select.add(new Option(os,os));select.onchange=makePrompt;label.append(select);$('settings').append(label)}makePrompt()}
function makePrompt(){const f=formats[type],os=$('os')?.value;$('result').hidden=false;document.querySelector('.builder-footer').hidden=false;$('copyStatus').textContent='';$('prompt').value=['나는 개발 초보자야. 아래 아이디어로 '+(os?os+'용 ':'')+f.task+'을 만들어줘.','','제목: '+candidate.title,'한 줄 설명: '+candidate.desc,'첫 기능: '+candidate.feature,'','첫 버전은 위 첫 기능을 처음부터 끝까지 사용할 수 있는 범위로 만들어줘. 무료로 구현할 방법을 우선하고, 비용이 꼭 필요하면 진행 전에 알려줘.','첫 기능에 맞는 예시 입력과 기대 결과를 정하고 실제 결과와 비교해줘.',f.test,'실제로 검사한 부분과 아직 확인하지 못한 부분을 구분하고, 내가 직접 실행하고 되돌리는 방법을 쉽게 알려줘.'].join('\n')}
$('copy').onclick=async()=>{const area=$('prompt');let copied=false;try{await navigator.clipboard.writeText(area.value);copied=true}catch{area.focus();area.select();try{copied=document.execCommand('copy')}catch{}}
$('copyStatus').textContent=copied?'복사했어요. 코딩 도구에 붙여 넣으세요.':'문구를 선택했어요. 길게 눌러 복사를 선택하세요.'};
render();
const transferStatus = $('transferStatus');
$('exportNotes').onclick = () => {
 if (!storageOK || !state.notes.length) {
  transferStatus.textContent = '내보낼 메모가 없어요.';
  return;
 }
 const backup = {format:'seednote', version:1, notes:state.notes, chosen:state.chosen};
 const file = new Blob([JSON.stringify(backup)], {type:'application/json'});
 const url = URL.createObjectURL(file);
 const link = document.createElement('a');
 link.href = url;
 link.download = '씨앗노트-' + new Date().toISOString().slice(0,10) + '.json';
 document.body.append(link);
 link.click();
 link.remove();
 setTimeout(() => URL.revokeObjectURL(url), 60000);
 transferStatus.textContent = '메모 ' + state.notes.length + '개의 파일을 준비했어요. 다운로드 위치를 확인하세요.';
};
$('importNotes').onclick = () => $('backupFile').click();
function readBackup(text) {
 return validateBackup(JSON.parse(text));
}
function validateBackup(data) {
 if (data?.format !== 'seednote' || data.version !== 1 || !Array.isArray(data.notes)) throw Error();
 const ids = new Set();
 const notes = data.notes.map(note => {
  if (!note || ['id','title','desc','feature'].some(k => typeof note[k] !== 'string' || !note[k].trim()) || ids.has(note.id)) throw Error();
  ids.add(note.id);
  return {id:note.id, title:note.title, desc:note.desc, feature:note.feature};
 });
 if (data.chosen !== null && !ids.has(data.chosen)) throw Error();
 return {notes, chosen:data.chosen};
}
function mergeBackup(backup) {
 const existing = new Map(state.notes.map(note => [note.id, note]));
 const reserved = new Set(backup.notes.map(note => note.id));
 const added = [];
 let chosen = state.chosen;
 for (const note of backup.notes) {
  let id = note.id;
  let suffix = 0;
  while (true) {
   const other = existing.get(id);
   if (other && ['title','desc','feature'].every(k => other[k] === note[k])) break;
   if (!other && (id === note.id || !reserved.has(id))) {
    const copy = {...note, id};
    added.push(copy);
    existing.set(id, copy);
    break;
   }
   id = note.id + '-import-' + (++suffix);
  }
  if (!chosen && backup.chosen === note.id) chosen = id;
 }
 return {added, chosen};
}
$('backupFile').onchange = async event => {
 const file = event.target.files[0];
 event.target.value = '';
 if (!file) return;
 let backup;
 try { backup = readBackup(await file.text()); }
 catch { transferStatus.textContent = '파일을 읽을 수 없어요. 씨앗노트에서 내보낸 JSON 파일을 선택하세요.'; return; }
 applyBackup(backup,false);
};
function applyBackup(backup,directTransfer) {
 const status = directTransfer ? $('notice') : transferStatus;
 if (!storageOK) { status.textContent = '저장 공간을 확인한 뒤 다시 시도하세요.'; return false; }
 const {added, chosen} = mergeBackup(backup);
 if (!added.length && chosen === state.chosen) {
  status.textContent = '추가할 메모가 없어요. 현재 메모를 그대로 유지했어요.';
  return true;
 }
 const message = '메모 ' + added.length + '개를 추가했어요. 이미 있는 메모 ' + (backup.notes.length - added.length) + '개는 건너뛰었어요.';
 if (save({notes:[...state.notes, ...added], chosen}, message)) {
  recommended = false;
  render();
  transferStatus.textContent = '';
  $('transfer').open = false;
  $('notice').scrollIntoView({block:'center'});
  return true;
 }
 status.textContent = '저장 공간을 확인한 뒤 다시 가져오세요.';
 return false;
}
const publicNote = new URL('https://tonight0717.github.io/seednote/');
function isOldAddress(origin) {
 try {
  const u = new URL(origin);
  return u.protocol === 'http:' && u.port === '8734' &&
   /^(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|169\.254\.\d+\.\d+)$/.test(u.hostname);
 } catch { return false; }
}
const direct = $('direct');
direct.hidden = !isOldAddress(location.origin);
direct.onclick = () => {
 const status = $('directStatus');
 if (!storageOK || !state.notes.length) {
  status.textContent = '옮길 메모가 없어요. 예전 메모가 보이는 주소인지 확인하세요.';
  return;
 }
 const ticket = Array.from(crypto.getRandomValues(new Uint8Array(16)), n=>n.toString(16).padStart(2,'0')).join('');
 const popup = window.open(publicNote.href + '#move-' + ticket, '_blank');
 if (!popup) { status.textContent = '새 탭이 차단됐어요. 이 주소의 팝업을 허용하고 다시 눌러 주세요.'; return; }
 direct.disabled = true;
 status.textContent = '새 씨앗노트가 열리고 있어요. 두 탭을 열어 두세요.';
 const timer = setTimeout(()=>finish('저장 결과를 확인하지 못했어요. 새 주소를 확인한 뒤 다시 시도할 수 있어요.'),90000);
 function finish(message) {
  clearTimeout(timer);
  window.removeEventListener('message', receive);
  direct.disabled = false;
  status.textContent = message;
 }
 function receive(e) {
  if (e.source !== popup || e.origin !== publicNote.origin || e.data?.ticket !== ticket) return;
  if (e.data.kind === 'seednote-ready') {
   popup.postMessage({kind:'seednote-deliver',ticket,backup:{format:'seednote',version:1,notes:state.notes,chosen:state.chosen}}, publicNote.origin);
  } else if (e.data.kind === 'seednote-stored') finish('옮기기가 끝났어요. 새 주소에서 메모를 확인하세요.');
  else if (e.data.kind === 'seednote-failed') finish('저장하지 못했어요. 새 주소에서 저장 공간과 안내를 확인하세요.');
 }
 window.addEventListener('message',receive);
};
function receiveDirectTransfer() {
 const match = /^#move-([a-f0-9]{32})$/.exec(location.hash);
 if (location.origin !== publicNote.origin || location.pathname !== publicNote.pathname || !match) return;
 const sender = window.opener, ticket = match[1];
 history.replaceState(null,'',location.pathname);
 if (!sender) { $('notice').textContent = '예전 탭과 연결되지 않았어요. 같은 브라우저에서 다시 시도하세요.'; return; }
 $('notice').textContent = '예전 씨앗노트에서 메모를 받는 중이에요.';
 function receive(e) {
  if (e.source !== sender || !isOldAddress(e.origin) || e.data?.ticket !== ticket || e.data.kind !== 'seednote-deliver') return;
  clearTimeout(timer);
  window.removeEventListener('message', receive);
  let stored = false;
  try { stored = applyBackup(validateBackup(e.data.backup),true); }
  catch { $('notice').textContent = '메모 형식을 확인할 수 없어 저장하지 못했어요.'; }
  sender.postMessage({kind:stored?'seednote-stored':'seednote-failed',ticket},e.origin);
  window.opener = null;
 }
 const timer = setTimeout(()=>{
  window.removeEventListener('message',receive);
  $('notice').textContent = '예전 탭과 연결되지 않았어요. 예전 주소에서 다시 눌러 주세요.';
  window.opener = null;
 },90000);
 window.addEventListener('message',receive);
 // Only the readiness signal goes to the opener. Notes travel to the fixed HTTPS origin.
 sender.postMessage({kind:'seednote-ready',ticket},'*');
}
window.addEventListener('storage', event => {
 if (event.storageArea !== localStorage || (event.key !== key && event.key !== null)) return;
 try {
  const latest = localStorage.getItem(key);
  state = latest ? validateBackup({ ...JSON.parse(latest), format:'seednote', version:1 }) : {notes:[],chosen:null};
  storageOK = true;
  previous = null;
  render();
  $('notice').textContent = '다른 탭의 변경 내용을 반영했어요.';
 } catch {
  storageOK = false;
  $('notice').textContent = '저장된 내용을 확인할 수 없어요. 페이지를 다시 열어 주세요.';
 }
});
receiveDirectTransfer();
const shareAndroid = $('shareAndroid');
shareAndroid.hidden = typeof Seednote !== 'undefined' || !/Android/i.test(navigator.userAgent) || typeof navigator.share !== 'function';
shareAndroid.onclick = async () => {
 if (!state.notes.length) {transferStatus.textContent='옮길 메모가 없어요.';return;}
 const payload=JSON.stringify({format:'seednote',version:1,notes:state.notes,chosen:state.chosen});
 try {await navigator.share({text:'SEEDNOTE/1\n'+payload});}
 catch(e){if(e.name!=='AbortError')transferStatus.textContent='공유하지 못했어요. 전체 메모 내보내기로 옮길 수 있어요.';}
};
